name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # golangci-lint's own PR-diff mode and gremlins --diff need history

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - run: go build ./...
      - run: go vet ./...

      # gofmt is not part of the golangci-lint run: v2 moved formatters into
      # their own section and this repo's config declares none. Checked here
      # so an unformatted file fails on the PR that wrote it.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"; echo "$unformatted"; exit 1
          fi

      # The architecture rests on two claims: Redline links no language
      # toolchain, and a provider's own knowledge stays behind the envelope.
      # Run the package as its own step so a failure reads as the boundary
      # breaking rather than as one more test going red. The whole package,
      # not a list of test names: a list is how the provider-boundary check
      # was left out of this step when it was added.
      - name: architecture boundary
        run: go test ./internal/boundary/ -v

      # -race because the providers shell out under a deadline, and a timer
      # racing a subprocess start is the kind of bug that passes every run
      # until it does not.
      - run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - run: go tool cover -func=coverage.out | tail -1

      # The same version `make lint` names in GOLANGCI_VERSION, so a developer
      # who runs the target locally runs this gate rather than a neighbouring
      # one. internal/toolchain's test fails when the two drift.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  release-config:
    # The release workflow only runs on a tag, so without this a broken
    # .goreleaser.yaml is discovered at release time by whoever is cutting
    # the release. `check` validates it and the snapshot proves every binary
    # it declares actually builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target

  bench:
    # Advisory: records numbers in the log, never fails the build. A
    # regression here is something a human reads, not a gate — the same
    # posture Redline's own coverage pane takes toward a number with no
    # threshold attached. continue-on-error is what makes that true; the
    # comment claimed it before anything enforced it.
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./... -bench=. -benchtime=10x -run='^$'

  mutate:
    # Advisory, diff-scoped, pull_request only: mutation-tests only the
    # lines a PR touched against its base. See `make mutate` for the same
    # command locally.
    #
    # continue-on-error sits on the job rather than the step. On the step it
    # covers a step that fails and not a step that is cancelled, and cancelled
    # is what actually happened: gremlins runs for minutes, the run ended
    # while it was still going, and an advisory job turned every pull request
    # red. On the job, nothing inside it can fail the build, which is what
    # advisory was supposed to mean.
    #
    # The timeout is the other half. gremlins re-runs the suite once per
    # mutant, so a large diff is genuinely slow, and without a bound a slow
    # run is indistinguishable from a hung one.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - run: gremlins unleash . --diff="origin/${{ github.base_ref }}" --timeout-coefficient=10
