version: "2"

# Must be <= the Go version the golangci-lint binary was built with, or it
# bails out during type-checking. Keep this in sync with go.mod.
run:
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - gocritic

    # errorlint: three files read an exit code by asserting *exec.ExitError
    # off a subprocess error, and three more formatted an error with %v. Both
    # work until something wraps the error on the way out, and then the exit
    # code reads as a failure to run and the chain is gone.
    - errorlint
    # bodyclose: the review and the scout each hold one HTTP client open for
    # minutes, so a body nobody closes is a connection nobody gets back.
    - bodyclose
    # usestdlibvars: a status code or a method written as a literal is a
    # literal somebody has to recognise.
    - usestdlibvars
    #
    # intrange is deliberately absent. It reads `for turn := 0; turn <
    # opts.MaxTurns+extra; turn++` in both scout drivers as a range loop,
    # which it is not: the bound is re-read every iteration and the loop
    # raises it, where a range evaluates it once. Taking its advice there
    # would delete the turn a refused record is corrected in.

  settings:
    gosec:
      excludes:
        # Redline's whole job is reading files and shelling out to git/gh/
        # linters at a revision the caller named (--pr, --commit, --branch).
        # That path is inherently "variable", and README.md documents it.
        - G204 # subprocess launched with a variable
        - G304 # file inclusion via variable
        - G301 # MkdirAll 0755 — correct for report/evidence directories, not secrets
        - G306 # WriteFile 0644 — correct for report/evidence files, not secrets
        - G203 # template.HTML at html.go:171/182 wraps already-escaped
               # output — highlightDiffFor (html.go:266,272) calls
               # template.HTMLEscapeString before the template.HTML cast.

  exclusions:
    rules:
      # Test fixtures write throwaway git repos and HTTP test doubles: file
      # permissions, subprocess args, and marker strings there are not a
      # threat model, and tests intentionally ignore some errors (e.g. a
      # background test HTTP server's Serve error).
      #
      # bodyclose is here for a different reason: a test's response comes from
      # httptest's recorder, which holds no connection to leak, and closing it
      # would be a line that reads like it matters.
      - linters: [gosec, errcheck, bodyclose]
        path: _test\.go$
