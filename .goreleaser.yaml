# GoReleaser builds the cross-platform binaries and cuts the GitHub release.
# Runs in CI on a pushed tag (see .github/workflows/release.yml); run
# `make snapshot` to build locally without tagging or publishing.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: redline
    main: ./cmd/redline
    binary: redline
    env:
      - CGO_ENABLED=0
    # Redline shells out to git and gh and manages ~/.redline; the surfaces it
    # is tested on are Linux and macOS, so those are what it ships.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

  # The Graphify context provider. Redline runs it as a subprocess and links
  # none of it, so it is its own binary; it ships in the same archive because
  # a provider that is not on PATH is a context layer that silently does not
  # run.
  - id: redline-graphify-context
    main: ./cmd/redline-graphify-context
    binary: redline-graphify-context
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: redline
    ids:
      - redline
      - redline-graphify-context
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
