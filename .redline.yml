# Both context providers for `redline review` on this repository. gorefactor
# is detected from .gorefactor.yaml on its own; it is spelled out here so the
# two entries sit together and the division of labour is visible: gorefactor
# resolves Go through go/types, and graphify speaks for everything else, with
# its name-resolved callers handed back to gorefactor for Go files.
context:
  - name: gorefactor
    command: gorefactor
    args: ["context", "--changed", "{{base}}", "--json"]
    scope: ["**/*.go"]
  - name: graphify
    command: redline-graphify-context
    args: ["--graph", "graphify-out/graph.json", "--changed", "{{base}}",
           "--defer-callers", "**/*.go"]
    scope: ["**/*"]

harness:
  profiles:
    - id: graph
      path: graphify-out/graph.json
      produce:
        command: graphify
        args: [update, ".", "--no-cluster"]
      when: stale
