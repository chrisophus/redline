# Redline's own configuration. See .redline.yml.example for every field.
#
# The context providers that resolve this change beyond the diff. Both degrade
# rather than fail: a provider whose binary is missing is reported as absent
# and the review runs without it.
context:
  # gorefactor resolves Go through go/types, so its callers are facts rather
  # than name matches. Detected from .gorefactor.yaml on its own; spelled out
  # here so the division of labour between the two is visible in one place.
  - name: gorefactor
    command: gorefactor
    args: ["context", "--changed", "{{base}}", "--json"]
    scope: ["**/*.go"]

  # graphify speaks for everything gorefactor does not, from a tree-sitter
  # index of the whole repository. Its caller edges match by name, so they are
  # handed back to gorefactor for Go files; everything else it knows still
  # comes through. Needs `graphify update .` to have written the graph.
  - name: graphify
    command: redline-graphify-context
    args: ["--graph", "graphify-out/graph.json", "--changed", "{{base}}",
           "--defer-callers", "**/*.go"]
    scope: ["**/*"]

  # The scout is on, and it is the one provider here that calls a model, so
  # `redline run` in this repository costs money. That was a deliberate trade
  # against `run` costing nothing: this checkout reviews from `review --run`
  # rather than reading the report on its own, so the observation exists to be
  # read by a model either way.
  #
  # It runs on gpt-5.6-luna over the OpenAI wire. The scout is the shape that
  # rewards a cheap input rate more than anything else here, because it resends
  # a growing conversation on every one of its turns while the review sends its
  # prompt once. Luna's input is a tenth of claude-sonnet-5's, so the turns are
  # where the saving happens.
  #
  # Needs OPENAI_API_KEY. OPENAI_BASE_URL and OPENAI_USER are read too, which
  # is how a gateway is reached without its address being committed here. With
  # no key the provider fails, the report names it under what could not be
  # determined, and the run continues: this is not a gate.
  #
  # --max-cost stays at the default. A full eight turns at Luna's rates comes
  # in well under it, and a tripwire set near what ordinary work costs teaches
  # whoever trips it to raise the number without reading it.
  #
  # --covered is what keeps it from paying a model to arrive second. gorefactor
  # resolves those five roles for Go from a type checker; a scout that greps
  # for the same callers is guessing at something already known. Naming them
  # here spends its turns on what nothing above can see: the rule this
  # repository wrote down, the migration the code is coupled to, the history
  # behind a deleted guard.
  - name: scout
    command: redline-scout
    args: ["--changed", "{{base}}",
           "--api", "openai", "--model", "gpt-5.6-luna",
           "--max-cost", "0.25",
           "--covered", "enclosing,caller,type,sibling,history",
           "--covered-scope", "**/*.go"]
    scope: ["**/*"]

# The coverage profile. Declared so `--prepare` regenerates it: without a
# profile here there are no produce steps, `--prepare` does nothing at all,
# and the diff-coverage number is read from whatever `coverage.out` was last
# left in the tree. `go test` is available to anyone with a Go toolchain, so
# unlike the graph below this one is safe to leave on.
#
# `when: missing` rather than `stale`. Stale failed the whole run whenever the
# profile was older than the change, which on a branch under active work is
# most of the time, and the answer was always the same two flags. A review
# refused outright is worse than a review whose coverage section is behind:
# what the section feeds is the line-level "added lines no test executes",
# which sharpens a finding rather than producing one, and the report says how
# old the profile is either way. A profile that is not there at all is still a
# failure, because then nothing measured and silence would read as a pass.
#
# Run `--prepare` when the coverage lines matter for the change in hand.
harness:
  profiles:
    - id: go
      path: coverage.out
      produce:
        command: make
        args: [coverage]
      when: missing
      scope: ["**/*.go"]

# The graph is a build artifact and an adapter reading a stale one describes
# code as it was. A harness profile is how that becomes visible, and it is
# commented out because a required profile fails `redline run` for anyone who
# has not installed graphify. Turn it on in a checkout that has.
